server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            stream: stream
            attrs: attrs
            tag: attrs.tag
      - json:
          expressions:
            container_name: tag
          source: tag
      - labels:
          stream:
          container_name:
      - output:
          source: log

  # Backend structured JSON logs
  - job_name: campuspulse-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: campuspulse-backend
          service: backend
          environment: development
          __path__: /var/log/campuspulse/backend*.log

  # System logs
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog
