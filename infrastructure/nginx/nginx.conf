worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"correlation_id":"$http_x_correlation_id",'
            '"request_id":"$request_id",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ──────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ── Security Headers ─────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header X-Frame-Options          "DENY"            always;
    add_header X-XSS-Protection         "1; mode=block"   always;
    add_header Referrer-Policy          "strict-origin"   always;
    add_header X-Request-ID             $request_id       always;
    server_tokens off;

    # ── Rate Limit Zones ─────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login_zone:10m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=anonymous_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:20m       rate=300r/m;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # ── Upstreams ────────────────────────────────────────────────
    upstream backend {
        least_conn;
        server host.docker.internal:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        server host.docker.internal:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── Main Server ──────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost campuspulse.local;
        client_max_body_size 10M;
        limit_conn conn_zone 100;

        # Inject correlation ID (use existing or generate)
        set $correlation_id $http_x_correlation_id;
        if ($correlation_id = "") {
            set $correlation_id $request_id;
        }
        proxy_set_header X-Correlation-ID $correlation_id;
        add_header       X-Correlation-ID $correlation_id always;

        # ── Health probes (no rate limit) ─────────────────────────
        location = /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        location = /livez {
            proxy_pass http://backend/livez;
            access_log off;
        }

        location = /readyz {
            proxy_pass http://backend/readyz;
            access_log off;
        }

        # ── Auth routes (strict rate limit) ──────────────────────
        location = /api/auth/login {
            limit_req zone=login_zone burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Anonymous submission (medium rate limit) ──────────────
        location = /api/incidents/anonymous {
            limit_req zone=anonymous_zone burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── General API (standard rate limit) ────────────────────
        location /api/ {
            limit_req zone=api_zone burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # ── WebSocket ─────────────────────────────────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── FastAPI Docs (dev only — remove in prod) ─────────────
        location /docs {
            proxy_pass http://backend/docs;
        }
        location /openapi.json {
            proxy_pass http://backend/openapi.json;
        }

        # ── Metrics (internal access only) ───────────────────────
        location /metrics {
            allow 172.0.0.0/8;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://backend/metrics;
        }

        # ── Next.js Frontend (catch-all) ─────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Next.js HMR WebSocket (dev only) ─────────────────────
        location /_next/webpack-hmr {
            proxy_pass http://frontend/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
