apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuspulse-frontend
  namespace: campuspulse
  labels:
    app: campuspulse-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campuspulse-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: campuspulse-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/campuspulse-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: campuspulse-config
                  key: NEXT_PUBLIC_API_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
