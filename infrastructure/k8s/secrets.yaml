# !! TEMPLATE ONLY — replace base64 values before applying !!
# Generate: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: campuspulse-secret
  namespace: campuspulse
type: Opaque
data:
  DATABASE_URL: <base64-encoded-postgresql-url>
  JWT_SECRET_KEY: <base64-encoded-jwt-secret>
  JWT_REFRESH_SECRET_KEY: <base64-encoded-refresh-secret>
  SMTP_USER: <base64-encoded-gmail-address>
  SMTP_PASSWORD: <base64-encoded-gmail-app-password>
  ALERT_EMAIL_FROM: <base64-encoded-from-email>
  ALERT_EMAIL_TO: <base64-encoded-to-email>
