name: Sentitron CampusPulse — Enterprise CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND:  ghcr.io/${{ github.repository_owner }}/campuspulse-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/campuspulse-frontend

jobs:
  # ============================================================
  # 1. BACKEND VERIFICATION
  # ============================================================
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx websockets aiosqlite slowapi

      - name: Infrastructure & Health Verification
        run: python -m pytest tests/infrastructure/ -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_campuspulse.db"
          JWT_SECRET_KEY: "test-secret-key"
          JWT_REFRESH_SECRET_KEY: "test-refresh-secret"

      - name: Governance & RBAC Verification
        run: python -m pytest tests/governance/ -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_campuspulse.db"

      - name: Security & Abuse Simulation
        run: python -m pytest tests/security/ -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_campuspulse.db"

      - name: Ingestion & Intelligence Verification
        run: python -m pytest tests/ingestion/ tests/intelligence/ -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_campuspulse.db"

      - name: Clustering Verification
        run: python -m pytest tests/clustering/ -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_campuspulse.db"

      - name: Reliability & Degradation Verification
        run: python -m pytest tests/reliability/ -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_campuspulse.db"

  # ============================================================
  # 2. FRONTEND BUILD VALIDATION
  # ============================================================
  frontend-build:
    name: Frontend Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Next.js build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ============================================================
  # 3. SECURITY SCANS (parallel with tests)
  # ============================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python SAST — Bandit
        run: |
          pip install bandit
          bandit -r backend/ -ll -x backend/.venv,backend/__pycache__ || true

      - name: Frontend dependency audit
        run: npm audit --audit-level=high || true
        working-directory: frontend

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Non-blocking in PR; blocking in main deploy

  # ============================================================
  # 4. LOAD SMOKE TEST
  # ============================================================
  load-smoke:
    name: Load & Concurrency Smoke Test
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio httpx aiosqlite

      - name: Concurrent ingestion burst (100 requests)
        run: python -m pytest tests/ingestion/test_load.py -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_campuspulse.db"

  # ============================================================
  # 5. BUILD & PUSH CONTAINERS (main branch only)
  # ============================================================
  build-and-push:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container vulnerability scan — Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_BACKEND }}:sha-${{ github.sha }}
          severity: 'CRITICAL'
          exit-code: '1'

  # ============================================================
  # 6. DEPLOY TO STAGING (main branch only)
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Apply K8s manifests
        run: |
          kubectl apply -f infrastructure/k8s/namespace.yaml
          kubectl apply -f infrastructure/k8s/configmap.yaml
          kubectl apply -f infrastructure/k8s/backend-deployment.yaml
          kubectl apply -f infrastructure/k8s/frontend-deployment.yaml
          kubectl apply -f infrastructure/k8s/services.yaml
          kubectl apply -f infrastructure/k8s/ingress.yaml
          kubectl apply -f infrastructure/k8s/hpa.yaml

      - name: Update image tags to new SHA
        run: |
          kubectl set image deployment/campuspulse-backend \
            backend=${{ env.IMAGE_BACKEND }}:sha-${{ github.sha }} \
            -n campuspulse
          kubectl set image deployment/campuspulse-frontend \
            frontend=${{ env.IMAGE_FRONTEND }}:sha-${{ github.sha }} \
            -n campuspulse

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/campuspulse-backend -n campuspulse --timeout=5m
          kubectl rollout status deployment/campuspulse-frontend -n campuspulse --timeout=5m

  # ============================================================
  # 7. SMOKE TEST STAGING
  # ============================================================
  smoke-staging:
    name: Smoke Test Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4

      - name: Health check
        run: |
          curl -f ${{ secrets.STAGING_URL }}/health || exit 1
          curl -f ${{ secrets.STAGING_URL }}/livez  || exit 1
          curl -f ${{ secrets.STAGING_URL }}/readyz || exit 1

      - name: API smoke test
        run: |
          pip install httpx
          python -c "
          import httpx, sys
          r = httpx.post('${{ secrets.STAGING_URL }}/api/auth/login',
                json={'username':'admin','password':'adminpassword'}, timeout=10)
          assert r.status_code == 200, f'Login failed: {r.status_code}'
          assert 'access_token' in r.json(), 'No token in response'
          assert 'refresh_token' in r.json(), 'No refresh token in response'
          print('Staging smoke test passed.')
          "

  # ============================================================
  # 8. ROLLBACK ON SMOKE FAILURE
  # ============================================================
  rollback:
    name: Rollback Staging on Failure
    runs-on: ubuntu-latest
    needs: smoke-staging
    if: failure()
    steps:
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Rollback backend deployment
        run: |
          kubectl rollout undo deployment/campuspulse-backend -n campuspulse
          kubectl rollout undo deployment/campuspulse-frontend -n campuspulse
          echo "Rollback completed. Previous revision restored."
